# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "13e7fffb81a9151375ac0ab3cbeb7952"
application_url = "https://www.buildmystore.dev/app"
embedded = false
name = "Buildmystore"

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/api/webhooks/compliance"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/api/webhooks/app-uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_themes,write_themes,read_content,write_content,read_files,write_files,read_publications,write_publications"
optional_scopes = [ ]

[auth]
redirect_urls = [ "https://www.buildmystore.dev/api/shopify/callback" ]
